services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-laci}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laci_secret_pass}
      POSTGRES_DB: ${DB_NAME:-laci_prod_db}
    volumes:
      - laci_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: always
    environment:
      - GIN_MODE=release
      - DB_HOST=db
      - DB_USER=${DB_USER:-laci}
      - DB_PASSWORD=${DB_PASSWORD:-laci_secret_pass}
      - DB_NAME=${DB_NAME:-laci_prod_db}
      - DB_PORT=5432
      - PORT=8080
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-LACI DOSCOM <doscom.go@gmail.com>}
      - APP_URL=${APP_URL:-https://laci.doscom.org}
      - INIT_KETUM_NIM=${INIT_KETUM_NIM:-}
      - INIT_KETUM_NAMA=${INIT_KETUM_NAMA:-}
      - INIT_KETUM_EMAIL=${INIT_KETUM_EMAIL:-}
      - INIT_KETUM_USERNAME=${INIT_KETUM_USERNAME:-}
    volumes:
      - laci_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    restart: always
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend

volumes:
  laci_db_data:
  laci_uploads:
