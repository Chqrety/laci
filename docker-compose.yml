services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: laci_doscom
    volumes:
      - laci_db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=laci_doscom
      - DB_PORT=5432
      - PORT=8080
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  laci_db_data:
