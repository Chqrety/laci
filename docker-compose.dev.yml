services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-laci_doscom_dev}
    ports:
      - "5432:5432"
    volumes:
      - laci_dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-laci_doscom_dev}
      - DB_PORT=5432
      - PORT=8080
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-LACI DOSCOM DEV <doscom.go@gmail.com>}
      - APP_URL=${APP_URL:-http://localhost:5173}
      - INIT_KETUM_NIM=${INIT_KETUM_NIM:-}
      - INIT_KETUM_NAMA=${INIT_KETUM_NAMA:-}
      - INIT_KETUM_EMAIL=${INIT_KETUM_EMAIL:-}
      - INIT_KETUM_USERNAME=${INIT_KETUM_USERNAME:-}
    volumes:
      - ./backend:/app
      - /app/tmp
      - laci_dev_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8080
      - VITE_API_URL=/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  laci_dev_db_data:
  laci_dev_uploads:
